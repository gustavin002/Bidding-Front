<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Registro</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <h1>Cadastro</h1>
        <form th:action="@{/register}"method="post">
            <div>
                <label>Nome</label>
                <input type="text"name="nome"required>
            </div>
            <br>
            <div>
                <label>Email</label>
                <input type="email"name="email"required>
            </div>
            <br>
            <div>
                <label>Senha</label>
                <input type="password"name="senha"required>
            </div>
            <br>
            <div>
                <label>Role</label>
                <select name="role">
                    <option value="COMPRADOR">
                    </option>
                    <option value="FORNECEDOR">
                    </option>
                </select>
            </div>
            <br>
            <button type="submit">
            </button>
        </form>
        <br>
        <p th:if="${erro}"
           th:text="${erro}"></p>
        <br>
        <a th:href="@{/login}">
            Voltar Login
        </a>
    </body>
</html>
