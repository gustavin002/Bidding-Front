<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}"rel="stylesheet">
    </head>
    
    <body class="d-flex justify-content-center align-items-center vh-100">
        <div class="card" style="max-width: 600px; min-width: 599px">
            
        <div class="card-header text-center">
            <h1>Registrar</h1>
        </div>
            
        <div class="card-body">
            <form th:action="@{/registrar}" th:object="${user}" method="post">

            <label>Nome:</label>
            <input type="text" th:field="*{nome}"th:class="${#fields.hasErrors('nome')}? 'form-control is-invalid': 'form-control'">
            <br/>

            <label>Email:</label>
            <input type="email" th:field="*{email}"th:class="${#fields.hasErrors('email')}? 'form-control is-invalid': 'form-control'">
            <br/>

            <label>Senha:</label>
            <input type="password" th:field="*{senha}"th:class="${#fields.hasErrors('senha')}? 'form-control is-invalid': 'form-control'">
            <br/>
            
            <label>Confirmar senha:</label>
            <input type="password" th:field="*{confirmarSenha}"th:class="${#fields.hasErrors('confirmarSenha')}? 'form-control is-invalid': 'form-control'">
            <br/>
            
            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmarSenha')}" 
                th:errors="*{confirmarSenha}">
            </div>

            <div class="d-flex justify-content-center">
                <button type="button" class="btn btn-dark">Cadastrar</button>
            </div>
            <br/>
            <a th:href="@{/login}" class="btn btn-link w-100">Já possui conta?</a>

            </form>
        </div>
        </div>
        <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
    </body>
</html>
