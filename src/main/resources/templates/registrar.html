<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Registrar</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link th:href="@{/webjars/bootstrap/5.3.0/css/bootstrap.min.css}"rel="stylesheet">
    </head>
    
    <body class="d-flex justify-content-center align-items-center vh-100">
        <div class="card" style="max-width: 600px; min-width: 599px">
            
        <div class="card-header text-center">
            <h1>Registrar</h1>
        </div>
            
        <div class="card-body">
            <form th:action="@{/registrar}" th:object="${user}" method="post">

            <div class="form-floating">    
            <input type="text" th:field="*{nome}" class="form-control" id="floatingName" placeholder="nome">
            <label for="floatingName">Nome:</label>
            <br/>
            </div>
                
            <div class="form-floating"> 
            <input type="email" th:field="*{email}" class="form-control" id="floatingInput" placeholder="name@example.com">
            <label for="floatingInput">Email:</label>
            <br/>
            </div>    
            
            <div class="form-floating">
            <input type="password" th:field="*{senha}" class="form-control" id="floatingPassword" placeholder="Password">
            <label for="floatingPassword">Senha:</label>
            <br/>
            </div>
                
            <div class="form-floating">    
            <input type="password" th:field="*{confirmarSenha}" class="form-control" id="confirmaSenha" placeholder="Password">
            <label for="confirmaSenha">Confirmar senha:</label>
            <br/>
            
            </div>
            
            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmarSenha')}" 
                th:errors="*{confirmarSenha}">
            </div>

            <div class="d-flex justify-content-center">
                <button type="button" class="btn btn-dark">Cadastrar</button>
            </div>
            <br/>
            <a th:href="@{/login}" class="btn btn-link w-100">Já possui conta?</a>
            
            <div th:if="${erroServidor}" class="alert alert-danger" style="color: #ef4444; background: rgba(239, 68, 68, 0.1); padding: 12px; border-radius: 6px; margin-bottom: 15px;">
                <span th:text="${erroServidor}">Erro padrão</span>
            </div>

            </form>
        </div>
        </div>
        <script th:src="@{/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js}"></script>
    </body>
</html>
